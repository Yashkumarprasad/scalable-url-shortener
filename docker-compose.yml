version: '3.8'

services:
  # Laravel PHP 8.1 FPM Service
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: url_shortener_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=url_shortener
      - DB_USERNAME=shortener_user
      - DB_PASSWORD=secret_db_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
    depends_on:
      - mysql
      - redis
    networks:
      - shortener_network

  # Nginx Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: url_shortener_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shortener_network

  # MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: url_shortener_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_USER: shortener_user
      MYSQL_PASSWORD: secret_db_password
      MYSQL_ROOT_PASSWORD: root_db_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shortener_network

  # Redis 7 Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shortener_network

  # Dedicated Background Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: url_shortener_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --queue=analytics,default --sleep=3 --tries=3 --timeout=60
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - shortener_network

networks:
  shortener_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
